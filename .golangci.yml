version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - zerologlint
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 5
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10
    lll:
      tab-width: 1
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - exportloopref
          - gocyclo
          - goconst
          - gosec
          - unparam
        path: _test(ing)?\.go
      - linters:
          - gocritic
        path: _test\.go
        text: (unnamedResult|exitAfterDefer)
      - linters:
          - gocritic
        text: '(hugeParam|rangeValCopy):'
      - linters:
          - staticcheck
        text: 'SA3000:'
      # SA1019 deprecation warnings for APIs we are forced to use because
      # crossplane-runtime/v2 still exposes them in public function signatures
      # (e.g. event.NewAPIRecorder takes the legacy record.EventRecorder, and
      # usage.Track requires resource.LegacyManaged). Until upstream provides
      # non-deprecated alternatives we must keep using these symbols.
      - linters:
          - staticcheck
        text: 'SA1019:.*(LegacyManaged|GetEventRecorderFor|WithExternalConnecter|ExternalConnecter)'
      - linters:
          - gosec
        text: 'G101:'
      - linters:
          - gosec
        text: 'G104:'
      # G404: randomString() generates names/identifiers, not security tokens
      - linters:
          - gosec
        text: 'G404:'
      # G117: json.Marshal on CF credential struct; Password is a required API credential, not a hardcoded secret
      - linters:
          - gosec
        text: 'G117:'
        path: test/test_utils\.go
    paths:
      - zz_generated\..+\.go$
      - third_party$
      - builtin$
      - examples$
      - scripts/
issues:
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/SAP/crossplane-provider-cloudfoundry
  exclusions:
    generated: lax
    paths:
      - zz_generated\..+\.go$
      - third_party$
      - builtin$
      - examples$
      - scripts/
