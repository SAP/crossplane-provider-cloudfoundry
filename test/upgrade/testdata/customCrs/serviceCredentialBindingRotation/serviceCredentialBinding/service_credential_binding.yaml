apiVersion: cloudfoundry.crossplane.io/v1alpha1
kind: ServiceCredentialBinding
metadata:
  name: upgrade-test-rotation-service-credential-binding
spec:
  forProvider:
    name: upgrade-test-rotation-service-credential-binding
    type: key
    serviceInstanceRef:
      name: upgrade-test-rotation-service-instance
      policy:
        resolve: Always
  providerConfigRef:
    name: default
  connectionDetailsAsJSON: true
  writeConnectionSecretToRef:
    name: upgrade-test-rotation-credentials
    namespace: default
