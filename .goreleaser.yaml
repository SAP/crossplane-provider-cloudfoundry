# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2

builds:
  - id: binary-build
    env:
      - CGO_ENABLED=0
      # FIPS 140-3: link the CMVP-certified Go Cryptographic Module (#5247) in
      # approved mode, matching the container image build.
      - GOFIPS140=certified
    mod_timestamp: "{{ .CommitTimestamp }}"
    main: ./cmd/provider
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - format: zip
    builds:
      - binary-build
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
changelog:
  use: github-native