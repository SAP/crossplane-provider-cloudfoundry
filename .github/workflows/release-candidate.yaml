# Release builds and publish a new release.
# Vars:
# REGISTRY_URL: registry url for the container registry

name: Publish Release Candidate

on:
  workflow_dispatch: {}

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
# Permissions need to be added here at the top level, since permissions
# to called workflows can only be reduced.
permissions:
  contents: write
  packages: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: true
    - name: Set Version
      id: version
      run: echo "version=v0.0.0-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs:
    - compute-version
    uses: SAP/crossplane-provider-btp/.github/workflows/release-build-publish.lib.yaml@dd91b564627eacdf079df3905b5a6efa4a4e9a53
    with:
      version: ${{ needs.compute-version.outputs.version }}
      release_type: release_candidate
    secrets: inherit
