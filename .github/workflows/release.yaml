# Release builds and publish a new release.

# Secrets:
# TEST_REGISTRY_USER: registry user for the container registry
# TEST_REGISTRY_PASSWORD: password for container registry
# Vars:
# REGISTRY_URL: registry url for the container registry

name: Release

on:
    workflow_dispatch:
      inputs:
        nextVersion:
          description: 'specify the release version in the semver format v[major].[minor].[patch] e.g. v0.0.0'
          required: true

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write
  packages: write

jobs:
    run-pre-checks:
      uses: SAP/crossplane-shared-workflows/.github/workflows/check-all-pre-checks.lib.yaml@main
      permissions:
        contents: read

    run-e2e-test:
      uses: SAP/crossplane-shared-workflows/.github/workflows/check-e2e-tests.lib.yaml@main
      needs:
      - run-pre-checks
      secrets: inherit

    build-and-publish:
      needs:
      - run-pre-checks
      - run-e2e-test
      uses: SAP/crossplane-shared-workflows/.github/workflows/release-build-publish.lib.yaml@main
      with:
        version: ${{ github.event.inputs.nextVersion }}
        release_type: release
      secrets: inherit
