changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug fixes
      labels:
        - bug
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔧 Other changes
      labels:
        - "*"